[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Tests that take longer to run
    gurobi: Tests that require Gurobi
    visualization: Tests for visualization functions

# Test configuration
addopts = 
    --verbose
    --tb=short
    --cov=optimizers
    --cov-report=term-missing
    --cov-report=html
    --no-cov-on-fail

# Test environment variables
env =
    PYTHONPATH=.
    GUROBI_LICENSE_FILE=gurobi.lic 